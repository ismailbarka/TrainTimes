apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration
 */
react {
    autolinkLibrariesWithApp()  // Automatically link libraries with your app
}

def enableProguardInReleaseBuilds = true  // Enable ProGuard for release builds
def jscFlavor = 'org.webkit:android-jsc:+'  // Default JSC

// Load the keystore properties from keystore.properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace "com.isbarka.traintimes"  // Specify the namespace for your app
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.isbarka.traintimes"
        minSdkVersion 23  // Updated to 23 for compatibility with gesture-handler
        targetSdkVersion 33  // Target the latest SDK version
        versionCode 2  // Increment version code for each release
        versionName "1.1"  // Update version name for new release
        multiDexEnabled true  // Enable MultiDex for large apps
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Use keystore properties for release builds
            storeFile file(keystoreProperties['MYAPP_RELEASE_STORE_FILE'])
            storePassword keystoreProperties['MYAPP_RELEASE_STORE_PASSWORD']
            keyAlias keystoreProperties['MYAPP_RELEASE_KEY_ALIAS']
            keyPassword keystoreProperties['MYAPP_RELEASE_KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Ensure you have your keystore details for release builds
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds  // Minify the code for better performance
            shrinkResources true  // Remove unused resources to reduce APK size
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false  // Ensure release build is not debuggable
        }
    }

    splits {
        abi {
            enable true  // Enable APK splits based on ABI (architecture)
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'  // Include all major architectures
            universalApk false  // Do not create a universal APK, only per-ABI APKs
        }
    }

    // No need for a 'bundle' block, ABI splits are defined above
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
